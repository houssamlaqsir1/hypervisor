server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cesium ships large .wasm/.js assets; don't let nginx buffer-limit them.
    client_max_body_size 20m;

    # REST API → backend container.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # STOMP-over-SockJS live alert feed. Needs the Upgrade headers and a
    # long read timeout, otherwise nginx closes the socket every 60s.
    location /ws/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA routing: unknown paths are React Router routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
